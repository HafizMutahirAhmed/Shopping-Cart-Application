<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #fef8f0; font-family: 'Poppins', sans-serif; text-align: center; padding: 60px; }
        input, button {
            padding: 12px;
            margin: 10px;
            width: 80%;
            max-width: 300px;
            border: 1px solid #a01212;
            border-radius: 6px;
        }
        button {
            background: #a01212;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Forgot Password</h2>
    <form method="POST">
        <input type="text" name="email" placeholder="Enter your registered email" required><br>
        <button type="submit">Send Reset Link</button>
    </form>
</body>
</html>
